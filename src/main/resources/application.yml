spring:
  application:
    name: app-productos

  # Configuración de la Conexión a PostgreSQL (con soporte para variables de entorno)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodstore_db}
    username: ${DB_USER:foodstore_user}
    password: ${DB_PASSWORD:foodstore_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Con la base caida, falla en 5 s (por defecto 30 s) en vez de dejar hilos y reintentos esperando.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}

  # Configuración de JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Liquibase (ver mas abajo); Hibernate solo valida
      # que las entidades coincidan con lo que Liquibase ya creo.
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  # Migraciones de esquema versionadas con Liquibase.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Generacion de descripciones de producto via Claude (Spring AI).
  # El valor por defecto de api-key es un placeholder invalido: permite que la
  # app y los tests levanten el contexto sin la variable de entorno seteada;
  # solo falla (401) si de verdad se invoca el endpoint de generar-descripcion.
  # Exporta ANTHROPIC_API_KEY con una key real de console.anthropic.com para usarlo.
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:sk-ant-no-configurada}
      chat:
        options:
          model: claude-haiku-4-5
          max-tokens: 300

logging:
  level:
    root: INFO
    com.foodstore: INFO
  pattern:
    # Agrega [requestId|correlationId] y reemplaza saltos de linea en el mensaje:
    # evita que un valor controlado por un cliente falsifique lineas de log.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:-}){magenta} %clr(---){faint} ${LOGGED_APPLICATION_NAME:-}%clr([%15.15t]){faint} %clr([%X{requestId:-}|%X{correlationId:-}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %replace(%m){'[\\r\\n]','_'}%n%wEx"
