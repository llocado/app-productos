spring:
  application:
    name: app-productos

  # Configuración de la Conexión a PostgreSQL (con soporte para variables de entorno)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodstore_db}
    username: ${DB_USER:foodstore_user}
    password: ${DB_PASSWORD:foodstore_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Con la base caida, falla en 5 s (por defecto 30 s) en vez de dejar hilos y reintentos esperando.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}

  # Configuración de JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Liquibase (ver mas abajo); Hibernate solo valida
      # que las entidades coincidan con lo que Liquibase ya creo.
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  # Migraciones de esquema versionadas con Liquibase.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Generacion de descripciones de producto via Claude (Spring AI).
  # El valor por defecto de api-key es un placeholder invalido: permite que la
  # app y los tests levanten el contexto sin la variable de entorno seteada;
  # solo falla (401) si de verdad se invoca el endpoint de generar-descripcion.
  # Exporta ANTHROPIC_API_KEY con una key real de console.anthropic.com para usarlo.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:supermercado}
    password: ${RABBITMQ_PASSWORD:supermercado}
    # Con RabbitMQ inalcanzable falla en 5 s (por defecto ~60 s) en vez de dejar hilos esperando.
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    # El publicador del outbox necesita confirmaciones y devoluciones: solo marca un evento como
    # publicado si RabbitMQ lo confirma Y alguna cola lo recibio (mandatory + returns).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Un mensaje que falla NUNCA se reencola: tras los reintentos va a la DLQ
        # (sin esto, RabbitMQ lo reentregaba en bucle infinito).
        default-requeue-rejected: false
        # 1 intento original + 3 reintentos (esperas de 1s, 2s y 4s); luego va a la DLQ.
        # Los rechazos definitivos (payload invalido) no se reintentan: ver RabbitMQConfig.
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:sk-ant-no-configurada}
      chat:
        options:
          model: claude-haiku-4-5
          max-tokens: 300

app:
  cors:
    # Origenes (separados por coma) cuyas paginas web pueden leer esta API desde el navegador. Por defecto, solo el
    # servidor de desarrollo de tienda-web. En produccion: el dominio real de la tienda (nunca "*").
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

productos:
  outbox:
    # Cada cuanto el publicador revisa eventos_salida y cuantos eventos toma por vuelta.
    intervalo: ${PRODUCTOS_OUTBOX_INTERVALO:1s}
    lote: ${PRODUCTOS_OUTBOX_LOTE:50}
    espera-confirmacion: ${PRODUCTOS_OUTBOX_ESPERA_CONFIRMACION:5s}

logging:
  level:
    root: INFO
    com.foodstore: INFO
    # Este handler escribe ~90 lineas de stack trace por cada mensaje rechazado; el listener ya registra
    # una linea concisa con el eventId, y los fallos tras los reintentos los registra el MessageRecoverer propio.
    org.springframework.amqp.listener.ConditionalRejectingErrorHandler: ERROR
    # Con mandatory + returns, RabbitTemplate avisa de cada mensaje devuelto (sin binding) una vez por segundo mientras el
    # outbox reintenta; el PublicadorOutbox ya lo registra con eventType y eventId, con espaciado propio.
    org.springframework.amqp.rabbit.core.RabbitTemplate: ERROR
    # Con la base caida, Hikari escribe un WARN con stack trace por cada reintento de conexion y por cada conexion
    # rota, Hibernate otro por cada SQL fallido y las transacciones otro ("excepcion sobrescrita por la de
    # rollback"): ~80 lineas cada uno. El fallo ya lo registran, en una linea, los manejadores propios.
    com.zaxxer.hikari.pool.PoolBase: ERROR
    com.zaxxer.hikari.pool.ProxyConnection: ERROR
    org.hibernate.orm.jdbc.error: ERROR
    org.springframework.transaction.support.TransactionTemplate: "OFF"
    org.springframework.transaction.interceptor.TransactionInterceptor: "OFF"
  pattern:
    # Agrega [requestId|correlationId] y reemplaza saltos de linea en el mensaje:
    # evita que un valor controlado por un cliente falsifique lineas de log.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:-}){magenta} %clr(---){faint} ${LOGGED_APPLICATION_NAME:-}%clr([%15.15t]){faint} %clr([%X{requestId:-}|%X{correlationId:-}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %replace(%m){'[\\r\\n]','_'}%n%wEx"
