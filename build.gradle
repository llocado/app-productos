plugins {
	id 'java'
	id 'jvm-test-suite'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.foodstore'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Versiones parcheadas por vulnerabilidades conocidas (GHSA) en las que gestiona Spring Boot 4.1.0.
ext['tomcat.version'] = '11.0.25'
ext['jackson-bom.version'] = '3.1.7'
ext['log4j2.version'] = '2.25.5'
ext['jackson-2-bom.version'] = '2.21.7'

repositories {
	mavenCentral()
	maven {
		name = "GitHubPackages"
		url = uri("https://maven.pkg.github.com/llocado/lib-domain-foods")
		credentials {
			username = project.findProperty("gprUser") ?: System.getenv("GITHUB_ACTOR")
			password = project.findProperty("gprKey") ?: System.getenv("GITHUB_TOKEN")
		}
	}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:2.0.1"
	}
}

// --- 1. DEPENDENCIAS DEL PROYECTO PRINCIPAL (MAIN) Y TEST UNITARIOS ---
dependencies {
	implementation 'com.foodstore:lib-domain-foods:0.0.1-SNAPSHOT'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.springframework.boot:spring-boot-liquibase'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// --- 2. REGISTRO DE LA SUITE DE INTEGRACIÓN ---
testing {
	suites {
		test {
			useJUnitJupiter()
		}

		intTest(JvmTestSuite) {
			useJUnitJupiter()

			targets {
				all {
					testTask.configure {
						group = 'verification'
						description = 'Ejecuta los tests de integracion (Testcontainers + PostgreSQL) del proyecto.'
						shouldRunAfter(test)
					}
				}
			}
		}
	}
}

// --- 3. CONFIGURACIÓN EXPLÍCITA DE DEPENDENCIAS PARA INT_TEST ---
dependencies {
	intTestImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')

	intTestImplementation project()
	intTestImplementation 'com.foodstore:lib-domain-foods:0.0.1-SNAPSHOT'

	intTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
	intTestImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	intTestImplementation 'org.springframework.boot:spring-boot-starter-validation'
	intTestImplementation 'org.springframework.boot:spring-boot-starter-test'
	intTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	intTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
	intTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	intTestImplementation 'org.testcontainers:testcontainers-postgresql'

	intTestRuntimeOnly 'org.postgresql:postgresql'
	intTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	intTestCompileOnly 'org.projectlombok:lombok'
	intTestAnnotationProcessor 'org.projectlombok:lombok'
}